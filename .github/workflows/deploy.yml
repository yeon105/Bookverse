name: Deploy To EC2

on:
  push:
    branches:
      - bookversebackend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_NAME: Bookverse

    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: Docker Hub에 로그인하기
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 생성
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bookversebackend .

      - name: Docker Hub에 Docker 이미지 Push하기
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bookversebackend:latest

      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true # 이전에 실행중인 컨테이너 중지
          script: |
            docker stop bookversebackend || true
            docker rm bookversebackend || true
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/bookversebackend:latest || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bookversebackend:latest
            docker run -d --name bookversebackend -p 8080:8080 --add-host=host.docker.internal:172.17.0.1 ${{ secrets.DOCKERHUB_USERNAME }}/bookversebackend:latest
