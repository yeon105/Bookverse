name: Deploy React To EC2

on:
  push:
    branches:
      - bookversefrontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_NAME: Bookverse

    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      # npm build는 이미 Dockerfile에서 진행해서 제거

      - name: Docker Hub에 로그인하기
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 생성
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bookversefrontend .
      - name: Docker Hub에 Docker 이미지 Push하기
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bookversefrontend:latest

      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            docker stop bookversefrontend || true
            docker rm bookversefrontend || true
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/bookversefrontend:latest || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bookversefrontend:latest
            docker run -d --name bookversefrontend -p 3000:80 ${{ secrets.DOCKERHUB_USERNAME }}/bookversefrontend:latest
